<html lang="en">
    <head>
        <title>Hello!</title>
        <link rel="stylesheet" href="nesting.css">
    <body>
        <div>
            <p>This is a paragraph inside the div.</p>

            List inside the div:
            <ul>
                <li>unordered item</li>
                <li>unordered item</li>
                <li>unordered item</li>
            </ul>
        </div>
        <p>This is a paragraph outside div:</p>
        <ul>
            <li>ordered item</li>
            <li>ordered item</li>
            <li>ordered item</li>
        </ul>
    </body>
</html>
